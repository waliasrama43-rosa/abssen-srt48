<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Absensi SRT48</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container-main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .card-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-title {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--secondary-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--secondary-color);
        }

        .spinner-border {
            color: var(--secondary-color);
        }

        .item-list {
            list-style: none;
        }

        .item-list li {
            background: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--secondary-color);
            transition: all 0.3s ease;
        }

        .item-list li:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .item-name {
            font-weight: 500;
            color: var(--primary-color);
            flex: 1;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 5px 12px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn-edit {
            background: var(--warning-color);
            color: white;
        }

        .btn-edit:hover {
            background: #e67e22;
            transform: scale(1.05);
        }

        .btn-delete {
            background: var(--danger-color);
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .btn-add {
            background: var(--success-color);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-add:hover {
            background: #229954;
            transform: scale(1.05);
        }

        .btn-add i {
            margin-right: 5px;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #95a5a6;
            font-style: italic;
        }

        .alert-box {
            display: none;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            animation: slideDown 0.3s ease;
        }

        .alert-box.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .card-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- HEADER -->
        <div class="header">
            <h1>🎓 Admin Absensi SRT48</h1>
            <p>Kelola Tendik dan Kegiatan dengan mudah</p>
        </div>

        <!-- ALERT MESSAGE -->
        <div id="alertBox" class="alert-box"></div>

        <!-- LOADING STATE -->
        <div id="loadingContainer" class="card-section">
            <div class="loading">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p style="margin-top: 15px;">Mengambil data dari server...</p>
            </div>
        </div>

        <!-- CONTENT AREA (Disembunyikan sampai data terload) -->
        <div id="contentArea" style="display: none;">
            <!-- SECTION TENDIK -->
            <div class="card-section">
                <h3 class="section-title">👥 Manajemen Tendik (Tenaga Didik)</h3>
                
                <button class="btn-add" onclick="openAddModal('tendik')">
                    ➕ Tambah Tendik Baru
                </button>

                <ul id="tendikList" class="item-list">
                    <!-- Items akan di-populate oleh JavaScript -->
                </ul>
            </div>

            <!-- SECTION KEGIATAN -->
            <div class="card-section">
                <h3 class="section-title">📋 Manajemen Kegiatan</h3>
                
                <button class="btn-add" onclick="openAddModal('kegiatan')">
                    ➕ Tambah Kegiatan Baru
                </button>

                <ul id="kegiatanList" class="item-list">
                    <!-- Items akan di-populated oleh JavaScript -->
                </ul>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>© 2024 Sistem Manajemen Absensi SRT48 | Powered by Google Apps Script</p>
        </div>
    </div>

    <!-- MODAL ADD/EDIT -->
    <div id="modalBackdrop" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;"></div>
    
    <div id="modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 1001; min-width: 400px; max-width: 90%; max-height: 80vh; overflow-y: auto;">
        <h4 id="modalTitle" style="color: var(--primary-color); margin-bottom: 20px; font-weight: bold;"></h4>
        
        <div class="mb-3">
            <label for="modalInput" class="form-label" id="modalLabel"></label>
            <input type="text" class="form-control" id="modalInput" placeholder="Masukkan nama...">
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
            <button class="btn btn-primary" id="modalSubmitBtn" onclick="submitModal()">Simpan</button>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI
        // ==========================================
        const URL_GAS = "https://script.google.com/macros/s/AKfycbz3sE7UYoTFgAClHIa4rWsOBSx_IFRCzHLFMnfdhhxLcOiKEiA9r52uF6mGqQ8SVAvh/exec";

        // State management
        let data = {
            tendik: [],
            kegiatan: []
        };

        let modalState = {
            isOpen: false,
            type: null,
            mode: 'add', // 'add' atau 'edit'
            originalValue: null
        };

        // ==========================================
        // LIFECYCLE HOOKS
        // ==========================================
        window.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            try {
                await loadData();
                renderUI();
            } catch (error) {
                showAlert('Gagal memuat data: ' + error.message, 'error');
                console.error('Init error:', error);
            }
        }

        // ==========================================
        // LOAD DATA DARI GOOGLE APPS SCRIPT
        // ==========================================
        async function loadData() {
            try {
                const response = await fetch(URL_GAS);
                if (!response.ok) throw new Error('Network response was not ok');
                
                data = await response.json();
                
                // Validasi data
                if (!Array.isArray(data.tendik)) data.tendik = [];
                if (!Array.isArray(data.kegiatan)) data.kegiatan = [];
                
                return data;
            } catch (error) {
                console.error('Load data error:', error);
                throw error;
            }
        }

        // ==========================================
        // RENDER UI
        // ==========================================
        function renderUI() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
            
            renderTendikList();
            renderKegiatanList();
        }

        function renderTendikList() {
            const container = document.getElementById('tendikList');
            
            if (data.tendik.length === 0) {
                container.innerHTML = '<div class="no-data">Belum ada tendik. Tambahkan yang baru!</div>';
                return;
            }

            container.innerHTML = data.tendik.map(item => `
                <li>
                    <span class="item-name">${item}</span>
                    <div class="action-buttons">
                        <button class="btn-action btn-edit" onclick="openEditModal('tendik', '${item}')">✏️ Edit</button>
                        <button class="btn-action btn-delete" onclick="deleteItem('tendik', '${item}')">🗑️ Hapus</button>
                    </div>
                </li>
            `).join('');
        }

        function renderKegiatanList() {
            const container = document.getElementById('kegiatanList');
            
            if (data.kegiatan.length === 0) {
                container.innerHTML = '<div class="no-data">Belum ada kegiatan. Tambahkan yang baru!</div>';
                return;
            }

            container.innerHTML = data.kegiatan.map(item => `
                <li>
                    <span class="item-name">${item}</span>
                    <div class="action-buttons">
                        <button class="btn-action btn-edit" onclick="openEditModal('kegiatan', '${item}')">✏️ Edit</button>
                        <button class="btn-action btn-delete" onclick="deleteItem('kegiatan', '${item}')">🗑️ Hapus</button>
                    </div>
                </li>
            `).join('');
        }

        // ==========================================
        // MODAL FUNCTIONS
        // ==========================================
        function openAddModal(type) {
            modalState.type = type;
            modalState.mode = 'add';
            modalState.originalValue = null;

            const typeLabel = type === 'tendik' ? 'Tendik' : 'Kegiatan';
            document.getElementById('modalTitle').textContent = `Tambah ${typeLabel} Baru`;
            document.getElementById('modalLabel').textContent = `Nama ${typeLabel}:`;
            document.getElementById('modalInput').value = '';
            document.getElementById('modalSubmitBtn').textContent = 'Tambah';

            showModal();
        }

        function openEditModal(type, value) {
            modalState.type = type;
            modalState.mode = 'edit';
            modalState.originalValue = value;

            const typeLabel = type === 'tendik' ? 'Tendik' : 'Kegiatan';
            document.getElementById('modalTitle').textContent = `Edit ${typeLabel}`;
            document.getElementById('modalLabel').textContent = `Nama ${typeLabel}:`;
            document.getElementById('modalInput').value = value;
            document.getElementById('modalSubmitBtn').textContent = 'Update';

            showModal();
        }

        function showModal() {
            document.getElementById('modal').style.display = 'block';
            document.getElementById('modalBackdrop').style.display = 'block';
            document.getElementById('modalInput').focus();
            modalState.isOpen = true;
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalBackdrop').style.display = 'none';
            modalState.isOpen = false;
        }

        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            if (event.target === document.getElementById('modalBackdrop')) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modalState.isOpen) {
                closeModal();
            }
        });

        // ==========================================
        // SUBMIT MODAL (ADD / EDIT)
        // ==========================================
        async function submitModal() {
            const value = document.getElementById('modalInput').value.trim();

            if (!value) {
                showAlert('Nama tidak boleh kosong!', 'error');
                return;
            }

            // Validasi duplicate (untuk mode add)
            if (modalState.mode === 'add') {
                const array = modalState.type === 'tendik' ? data.tendik : data.kegiatan;
                if (array.includes(value)) {
                    showAlert(`${value} sudah ada!`, 'error');
                    return;
                }
            }

            try {
                if (modalState.mode === 'add') {
                    await addItem(modalState.type, value);
                } else {
                    await editItem(modalState.type, modalState.originalValue, value);
                }
                
                closeModal();
                await loadData();
                renderUI();
            } catch (error) {
                showAlert('Gagal menyimpan: ' + error.message, 'error');
            }
        }

        // ==========================================
        // API FUNCTIONS
        // ==========================================
        async function addItem(type, value) {
            const response = await fetch(URL_GAS, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'addSetting',
                    type: type,
                    value: value
                })
            });

            if (!response.ok) throw new Error('Gagal menambah item');
            showAlert(`${value} berhasil ditambahkan!`, 'success');
        }

        async function editItem(type, oldValue, newValue) {
            const response = await fetch(URL_GAS, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'editSetting',
                    type: type,
                    oldValue: oldValue,
                    newValue: newValue
                })
            });

            if (!response.ok) throw new Error('Gagal mengubah item');
            showAlert(`${oldValue} berhasil diubah menjadi ${newValue}!`, 'success');
        }

        async function deleteItem(type, value) {
            if (!confirm(`Yakin hapus "${value}"? Tindakan ini tidak dapat dibatalkan.`)) {
                return;
            }

            try {
                const response = await fetch(URL_GAS, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteSetting',
                        type: type,
                        value: value
                    })
                });

                if (!response.ok) throw new Error('Gagal menghapus item');
                
                showAlert(`${value} berhasil dihapus!`, 'success');
                await loadData();
                renderUI();
            } catch (error) {
                showAlert('Gagal menghapus: ' + error.message, 'error');
            }
        }

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert-box show alert-${type}`;

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3000);
        }

        // Allow submit on Enter key
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && modalState.isOpen) {
                submitModal();
            }
        });
    </script>
</body>
</html>
